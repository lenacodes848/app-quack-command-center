name: secrets-and-source-protection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Keep GITLEAKS_VERSION equal to the version recorded in research.md.
  # The checksum is from the official release's gitleaks_<version>_checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Repository structure, worksheet and scanner tests
        run: npm run test:repo
      - name: Source protection scan
        run: npm run scan:source
      - name: Secrets scan (full working tree)
        run: npm run scan:secrets
      - name: Secrets scan (full history)
        run: npm run scan:secrets:history
