name: secrets-and-source-protection

on:
  push:
    branches: [main]
  pull_request:

# A permissions block drops every unlisted scope to none. gitleaks-action lists the
# pull request's commits on pull_request events, which needs pull-requests: read.
# Read is the minimum. PR comments are disabled below so no write scope is needed.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repository structure and worksheet tests
        run: npm run test:repo
      - name: Source protection scan
        run: npm run scan:source
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
